<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет | САПС</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cart.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .account-container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
    .account-auth-card { max-width: 460px; margin: 60px auto; background: #fff; border-radius: 20px; border: 1px solid var(--border-color); padding: 36px; box-shadow: 0 12px 40px rgba(0,0,0,0.06); }
    .auth-tabs { display: flex; border-bottom: 2px solid #f0f0f0; margin-bottom: 24px; }
    .auth-tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 700; color: #888; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 1rem; }
    .auth-tab-btn.active { color: #000; border-bottom-color: #000; }
    
    .account-header-card { background: linear-gradient(135deg, #111111 0%, #222222 100%); color: #fff; border-radius: 20px; padding: 32px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .account-user-info { display: flex; align-items: center; gap: 20px; }
    .account-avatar { width: 64px; height: 64px; border-radius: 50%; background: #fff; color: #111; font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .account-id-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-top: 6px; }
    
    .account-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 36px; }
    .account-stat-card { background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); }
    .stat-label { font-size: 0.85rem; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: #111; margin-top: 6px; }
    
    .orders-list { display: flex; flex-direction: column; gap: 20px; }
    .order-card { background: #fff; border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #f0f0f0; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .order-status { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .status-new { background: #e3f2fd; color: #1976d2; }
    .status-processing { background: #fff3e0; color: #f57c00; }
    .status-shipped { background: #f3e5f5; color: #7b1fa2; }
    .status-completed { background: #e8f5e9; color: #388e3c; }
    .status-cancelled { background: #ffebee; color: #d32f2f; }

    .order-item-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px dashed #eee; }
    .order-item-row:last-child { border-bottom: none; }
    .order-item-img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        САПС
        <span>STEEL</span>
      </a>

      <nav class="site-nav">
        <a href="/catalogue" class="nav-link">Каталог</a>
        <a href="/rings" class="nav-link">Кольца</a>
        <a href="/earrings" class="nav-link">Серьги</a>
        <a href="/pendants" class="nav-link">Подвески</a>
        <a href="/custom-sups" class="nav-link">3D Кастом</a>
        <a href="/#about" class="nav-link">О нас</a>
        <a href="/#reviews" class="nav-link">Отзывы</a>
        <div class="nav-dropdown-wrap">
          <button class="nav-dropdown-toggle" type="button">
            <span>ПОКУПАТЕЛЯМ</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1L5 5L9 1"/></svg>
          </button>
          <div class="nav-dropdown-menu">
            <a href="/buyers?topic=care" class="nav-dropdown-item" data-buyer-topic="care">Уход за украшениями</a>
            <a href="/buyers?topic=delivery" class="nav-dropdown-item" data-buyer-topic="delivery">Доставка и оплата</a>
            <a href="/buyers?topic=return" class="nav-dropdown-item" data-buyer-topic="return">Возврат товара</a>
            <a href="/buyers?topic=warranty" class="nav-dropdown-item" data-buyer-topic="warranty">Гарантия</a>
            <a href="/buyers?topic=faq" class="nav-dropdown-item" data-buyer-topic="faq">Часто задаваемые вопросы</a>
            <a href="/buyers?topic=loyalty" class="nav-dropdown-item" data-buyer-topic="loyalty">Программа лояльности</a>
          </div>
        </div>
        <a href="/cooperation" class="nav-link js-open-cooperation" id="nav-cooperation-link">Сотрудничество</a>
      </nav>

      <div class="header-actions">
        <button class="cart-toggle-btn js-cart-toggle" title="Корзина">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-count-badge" style="display:none;">0</span>
        </button>

        <button class="mobile-menu-toggle" title="Меню">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav Drawer -->
  <div class="mobile-nav-drawer">
    <div class="mobile-nav-header">
      <div class="brand-logo">САПС</div>
      <button class="mobile-nav-close" style="background:none; border:none; font-size:1.8rem; cursor:pointer;">×</button>
    </div>
    <div class="mobile-nav-links">
      <a href="/catalogue">Каталог</a>
      <a href="/rings">Кольца</a>
      <a href="/earrings">Серьги</a>
      <a href="/pendants">Подвески</a>
      <a href="/bracelets">Браслеты</a>
      <a href="/custom-sups">3D Кастом</a>
      <a href="/#about">О нас</a>
      <a href="/#reviews">Отзывы</a>
      <a href="/buyers">Покупателям</a>
      <a href="/cooperation" class="js-open-cooperation">Сотрудничество</a>
    </div>
  </div>

  <main class="account-container">
    <!-- AUTH CARD (Shown if not logged in) -->
    <div id="account-auth-view" class="account-auth-card" style="display:none;">
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">Вход</button>
        <button type="button" class="auth-tab-btn" id="tab-reg-btn" onclick="switchAuthTab('register')">Регистрация</button>
      </div>

      <!-- Login Form -->
      <form id="customer-login-form">
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label">Email или номер телефона</label>
          <input type="text" id="login-identifier" class="form-input" placeholder="example@mail.ru или +7 (999) 000-00-00" required>
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label class="form-label">Пароль</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>
        <div id="login-error-msg" style="color:red; font-size:0.85rem; margin-bottom:12px;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Войти в личный кабинет</button>
      </form>

      <!-- Register Form -->
      <form id="customer-register-form" style="display:none;">
        <div style="background:#f9f9fb; padding:12px 16px; border-radius:10px; font-size:0.85rem; color:#555; margin-bottom:16px; border:1px solid #eee;">
          🎁 <b>Приветственный бонус!</b> Получите 100 бонусов при регистрации на первую покупку.
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Ваше имя *</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Артем" required>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Email *</label>
          <input type="email" id="reg-email" class="form-input" placeholder="artem@example.com" required>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Телефон</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Дата рождения (для скидки на ДР 🎂)</label>
          <input type="date" id="reg-birthdate" class="form-input">
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label">Пароль *</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Минимум 6 символов" required minlength="6">
        </div>
        <div id="reg-error-msg" style="color:red; font-size:0.85rem; margin-bottom:12px;"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
      </form>
    </div>

    <!-- MAIN DASHBOARD VIEW (Shown when logged in) -->
    <div id="account-dashboard-view" style="display:none;">
      <!-- Header Banner -->
      <div class="account-header-card">
        <div class="account-user-info">
          <div class="account-avatar" id="dash-avatar">А</div>
          <div>
            <h1 style="font-size:1.6rem; font-weight:800; margin-bottom:4px;" id="dash-name">Загрузка...</h1>
            <div id="dash-email" style="font-size:0.9rem; color:#ccc;"></div>
            <div class="account-id-badge">
              <span>🆔 ID:</span>
              <strong id="dash-user-code">SUPS-U0000</strong>
            </div>
          </div>
        </div>

        <div style="text-align:right;">
          <div style="font-size:0.8rem; color:#aaa; text-transform:uppercase; font-weight:700;">Статус привилегий</div>
          <div style="font-size:1.4rem; font-weight:800; color:#f59e0b; margin-top:2px;" id="dash-tier-name">Бронзовый</div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="logoutCustomer()" style="margin-top:10px; background:rgba(255,255,255,0.1); border:none; color:#fff;">Выйти</button>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="account-stats-grid">
        <div class="account-stat-card">
          <div class="stat-label">Бонусный баланс</div>
          <div class="stat-value"><span id="dash-bonuses">0</span> <span style="font-size:1rem; color:#888;">Б</span></div>
          <div style="font-size:0.75rem; color:#888; margin-top:4px;">1 бонус = 1 рубль скидки</div>
        </div>

        <div class="account-stat-card">
          <div class="stat-label">Персональная скидка</div>
          <div class="stat-value" id="dash-discount">0%</div>
          <div style="font-size:0.75rem; color:#888; margin-top:4px;">Применяется автоматически</div>
        </div>

        <div class="account-stat-card">
          <div class="stat-label">Всего покупок</div>
          <div class="stat-value" id="dash-total-spent">0 ₽</div>
          <div style="font-size:0.75rem; color:#888; margin-top:4px;" id="dash-next-tier-info">До следующего уровня...</div>
        </div>

        <div class="account-stat-card" style="background:#fafafa;">
          <div class="stat-label">Активировать промокод</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <input type="text" id="account-promo-input" class="form-input" placeholder="SUPS10" style="text-transform:uppercase; font-weight:700;">
            <button type="button" class="btn btn-primary btn-sm" onclick="activateAccountPromo()">Применить</button>
          </div>
          <div id="account-promo-msg" style="font-size:0.8rem; margin-top:6px; font-weight:600;"></div>
        </div>
      </div>

      <!-- Purchases & Orders Section -->
      <div style="margin-top:40px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2 class="title-md" style="font-size:1.4rem;">Моя история покупок</h2>
          <a href="/leave-review" class="btn btn-secondary btn-sm">Оставить отзыв на купленное</a>
        </div>

        <div id="account-orders-container" class="orders-list">
          <div style="text-align:center; padding:40px; color:#888;">Загрузка заказов...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="text-align:center; color:#888;">
      © 2026 САПС. Все права защищены.
    </div>
  </footer>

  <script>
    let customerToken = localStorage.getItem('sups_customer_token');
    let currentCustomer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initCustomerApp();
    });

    async function initCustomerApp() {
      if (!customerToken) {
        showAuthView();
        return;
      }

      try {
        const res = await fetch('/api/customers/me', {
          headers: { 'Authorization': `Bearer ${customerToken}` }
        });
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        currentCustomer = data.customer;
        showDashboardView();
      } catch (err) {
        customerToken = null;
        localStorage.removeItem('sups_customer_token');
        showAuthView();
      }
    }

    function showAuthView() {
      document.getElementById('account-auth-view').style.display = 'block';
      document.getElementById('account-dashboard-view').style.display = 'none';

      // Login form submit
      document.getElementById('customer-login-form').onsubmit = async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error-msg');

        try {
          errEl.textContent = '';
          const res = await fetch('/api/customers/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login: identifier, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Ошибка входа');

          customerToken = data.token;
          localStorage.setItem('sups_customer_token', customerToken);
          currentCustomer = data.customer;
          showDashboardView();
        } catch (err) {
          errEl.textContent = err.message;
        }
      };

      // Register form submit
      document.getElementById('customer-register-form').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const birthdate = document.getElementById('reg-birthdate').value;
        const password = document.getElementById('reg-password').value;
        const errEl = document.getElementById('reg-error-msg');

        try {
          errEl.textContent = '';
          const res = await fetch('/api/customers/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, birthdate, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Ошибка регистрации');

          customerToken = data.token;
          localStorage.setItem('sups_customer_token', customerToken);
          currentCustomer = data.customer;
          showDashboardView();
        } catch (err) {
          errEl.textContent = err.message;
        }
      };
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('tab-reg-btn').classList.remove('active');
        document.getElementById('customer-login-form').style.display = 'block';
        document.getElementById('customer-register-form').style.display = 'none';
      } else {
        document.getElementById('tab-reg-btn').classList.add('active');
        document.getElementById('tab-login-btn').classList.remove('active');
        document.getElementById('customer-register-form').style.display = 'block';
        document.getElementById('customer-login-form').style.display = 'none';
      }
    }

    async function showDashboardView() {
      document.getElementById('account-auth-view').style.display = 'none';
      document.getElementById('account-dashboard-view').style.display = 'block';

      const c = currentCustomer;
      document.getElementById('dash-avatar').textContent = (c.name || 'А')[0].toUpperCase();
      document.getElementById('dash-name').textContent = c.name;
      document.getElementById('dash-email').textContent = c.email + (c.phone ? ` • ${c.phone}` : '');
      document.getElementById('dash-user-code').textContent = c.user_code;

      const tier = c.tier || { name: 'Бронзовый', discount: 0 };
      document.getElementById('dash-tier-name').textContent = tier.name;
      document.getElementById('dash-bonuses').textContent = c.bonus_points || 0;
      document.getElementById('dash-discount').textContent = `${c.personal_discount || tier.discount || 0}%`;
      document.getElementById('dash-total-spent').textContent = `${(c.total_spent || 0).toLocaleString('ru-RU')} ₽`;

      const nextInfo = document.getElementById('dash-next-tier-info');
      if (tier.nextTier) {
        nextInfo.textContent = `Еще ${tier.nextTierSpent.toLocaleString('ru-RU')} ₽ до уровня «${tier.nextTier}»`;
      } else {
        nextInfo.textContent = 'У вас максимальный платиновый уровень!';
      }

      loadCustomerOrders();
    }

    async function loadCustomerOrders() {
      const container = document.getElementById('account-orders-container');
      try {
        const res = await fetch('/api/customers/orders', {
          headers: { 'Authorization': `Bearer ${customerToken}` }
        });
        const data = await res.json();
        const orders = data.orders || [];

        if (orders.length === 0) {
          container.innerHTML = `
            <div style="background:#fff; border-radius:16px; border:1px solid #eee; padding:40px; text-align:center;">
              <div style="font-size:2.5rem; margin-bottom:12px;">🛍️</div>
              <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:6px;">У вас пока нет заказов</h3>
              <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">Перейдите в каталог, чтобы выбрать стильные украшения САПС</p>
              <a href="/catalogue" class="btn btn-primary btn-sm">Перейти в каталог</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const items = Array.isArray(o.items) ? o.items : [];
          const statusClass = `status-${o.status || 'new'}`;
          const statusLabels = { new: 'Новый', processing: 'В обработке', shipped: 'Отправлен', completed: 'Выполнен', cancelled: 'Отменен' };

          const itemsHtml = items.map(item => `
            <div class="order-item-row">
              <img src="${item.image || '/assets/placeholder.jpg'}" class="order-item-img">
              <div style="flex:1;">
                <strong style="font-size:0.95rem;">${item.title}</strong>
                ${item.size ? `<div style="font-size:0.8rem; color:#666;">Размер: ${item.size}</div>` : ''}
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; font-size:0.95rem;">${item.price} ₽</div>
                <a href="/leave-review?product_id=${item.id}" class="btn btn-secondary btn-sm" style="font-size:0.75rem; padding:4px 8px; margin-top:4px;">Отзыв</a>
              </div>
            </div>
          `).join('');

          const generalReviewBtn = items.length >= 2 ? `
            <div style="margin-top:14px; text-align:right; border-top:1px solid #f0f0f0; padding-top:10px;">
              <a href="/leave-review?order_id=${o.id}" class="btn btn-secondary btn-sm" style="font-size:0.8rem;">
                ✨ Написать общий отзыв на весь заказ (${items.length} украшения)
              </a>
            </div>
          ` : '';

          return `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <strong style="font-size:1.1rem;">Заказ #${o.order_number}</strong>
                  <span style="font-size:0.85rem; color:#888; margin-left:8px;">${formatDate(o.created_at)}</span>
                </div>
                <div>
                  <span class="order-status ${statusClass}">${statusLabels[o.status] || o.status}</span>
                  <strong style="margin-left:12px; font-size:1.1rem;">${o.total_price.toLocaleString('ru-RU')} ₽</strong>
                </div>
              </div>
              <div>${itemsHtml}</div>
              ${generalReviewBtn}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div style="color:red; text-align:center;">Ошибка загрузки заказов</div>';
      }
    }

    async function activateAccountPromo() {
      const inputEl = document.getElementById('account-promo-input');
      const msgEl = document.getElementById('account-promo-msg');
      if (!inputEl || !msgEl) return;

      const code = inputEl.value.trim();
      if (!code) {
        msgEl.style.color = '#d32f2f';
        msgEl.textContent = 'Введите промокод';
        return;
      }

      try {
        const res = await fetch('/api/customers/activate-promo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${customerToken}`
          },
          body: JSON.stringify({ code })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ' Ошибка активации');

        msgEl.style.color = '#2e7d32';
        msgEl.textContent = `✅ ${data.message}`;

        // Refresh customer info
        initCustomerApp();
      } catch (err) {
        msgEl.style.color = '#d32f2f';
        msgEl.textContent = `❌ ${err.message}`;
      }
    }

    function logoutCustomer() {
      customerToken = null;
      localStorage.removeItem('sups_customer_token');
      showAuthView();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
  </script>
